name: CI
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Database, RLS and storage policy tests (local PostgreSQL)
        run: npm run test:db
      - name: PDF tests
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils fonts-liberation
          npx playwright install --with-deps chromium
          npm run test:pdf

  e2e:
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils fonts-liberation
          npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
